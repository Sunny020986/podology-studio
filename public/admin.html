<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Адмінка: запис і чат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>

<section id="login" class="admin-wrap" style="max-width:420px;margin-top:80px">
  <div class="panel">
    <h2>Вхід в адмінку</h2>
    <form id="loginForm">
      <input id="tokenInput" class="input" type="password" placeholder="Токен адміна" autocomplete="current-password" required>
      <button class="btn btn-primary btn-block" type="submit">Увійти</button>
      <div class="msg error" id="loginMsg"></div>
    </form>
  </div>
</section>

<section id="app" class="admin-wrap" hidden>
  <div class="admin-top">
    <h2 style="margin:0">Адмінка</h2>
    <div class="nav-actions">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Увімкнути темну тему">
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn btn-ghost small" id="logoutBtn" type="button">Вийти</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab" data-tab="appointments" type="button">Записи</button>
    <button class="tab" data-tab="clients" type="button">Клієнти</button>
    <button class="tab" data-tab="chat" type="button">Чат</button>
    <button class="tab" data-tab="schedule" type="button">Розклад</button>
    <button class="tab" data-tab="blocks" type="button">Блокування</button>
    <button class="tab" data-tab="services" type="button">Послуги</button>
    <button class="tab" data-tab="reviews" type="button">Відгуки</button>
    <button class="tab" data-tab="studio" type="button">Кабінет</button>
  </div>
  <div class="notice" id="notice" role="status"></div>
  <div class="panel" id="view"></div>
</section>

<script src="admin.js"></script>
</body>
</html>
