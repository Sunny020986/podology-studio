<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Відгук про візит</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>
<main class="review-page">
  <a class="review-home" href="/">← На сайт</a>
  <div class="card review-card">
    <h1 id="reviewTitle">Відгук про візит</h1>
    <p class="muted" id="reviewSub">Завантажую…</p>
    <form id="reviewForm" hidden>
      <fieldset class="stars-field">
        <legend class="step-label">Ваша оцінка</legend>
        <div class="stars">
          <input type="radio" name="rating" id="star5" value="5"><label for="star5" title="5 з 5">★<span class="sr-only">5 зірок</span></label>
          <input type="radio" name="rating" id="star4" value="4"><label for="star4" title="4 з 5">★<span class="sr-only">4 зірки</span></label>
          <input type="radio" name="rating" id="star3" value="3"><label for="star3" title="3 з 5">★<span class="sr-only">3 зірки</span></label>
          <input type="radio" name="rating" id="star2" value="2"><label for="star2" title="2 з 5">★<span class="sr-only">2 зірки</span></label>
          <input type="radio" name="rating" id="star1" value="1"><label for="star1" title="1 з 5">★<span class="sr-only">1 зірка</span></label>
        </div>
      </fieldset>
      <label class="step-label" for="reviewText">Що сподобалось або що покращити (необов'язково)</label>
      <textarea class="input" id="reviewText" rows="4" maxlength="1000"></textarea>
      <p class="acc-msg" id="reviewMsg" role="status"></p>
      <button class="btn btn-primary btn-block" type="submit">Надіслати відгук</button>
    </form>
  </div>
</main>
<script src="review.js"></script>
</body>
</html>
